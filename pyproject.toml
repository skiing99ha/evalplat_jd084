[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skiing99ha-evalplat_jd084"
version = "0.1.0"
description = "把候选项映射到类别上，算出模型评测平台工程师·向量索引的召回与构建代价的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "skiing99ha" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://skiing99ha.github.io"
Repository = "https://github.com/skiing99ha/evalplat_jd084"
Issues = "https://github.com/skiing99ha/evalplat_jd084/issues"

[project.scripts]
evalplat_jd084 = "evalplat_jd084:main"

[tool.setuptools]
py-modules = ["evalplat_jd084"]
